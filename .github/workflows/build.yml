name: CI

# Docker image is built by gdsl-exchange (checks out this repo and pushes to GHCR).
# This workflow runs tests on every push to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate --schema=packages/db/prisma/schema.prisma
      - run: npm run build:packages
      - run: npm run build --workspace=apps/api
      - run: npm run test --workspace=@cryptoflow/api

  trigger-production-build:
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Ask gdsl-exchange to build + deploy API image
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not set — run Build images on gdsl-exchange manually (Actions → workflow_dispatch)."
            exit 0
          fi
          gh api repos/Madhusahitya/gdsl-exchange/dispatches -f event_type=api-updated
