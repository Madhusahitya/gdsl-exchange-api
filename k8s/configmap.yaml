apiVersion: v1
kind: ConfigMap
metadata:
  name: gdsl-api-config
  namespace: gdsl-exchange
data:
  NODE_ENV: "production"
  PORT: "8000"
  SOCKET_PORT: "8001"
  FRONTEND_URL: "https://staging.eizy.trade"
  COOKIE_DOMAIN: ".eizy.trade"
  ALLOWED_CORS_ORIGINS: "https://staging.eizy.trade,https://staging-api.eizy.trade,https://staging-socket.eizy.trade,http://localhost:8003,http://localhost:3000,http://127.0.0.1:8003,http://127.0.0.1:3000"
  DEFAULT_CHAIN: "BSC"
  DEMO_MODE: "false"
