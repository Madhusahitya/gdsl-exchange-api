apiVersion: v1
kind: Secret
metadata:
  name: gdsl-api-secrets
  namespace: gdsl-exchange
type: Opaque
stringData:
  # Connection string to Managed PostgreSQL database (e.g. DigitalOcean Managed DB / AWS RDS)
  DATABASE_URL: "postgresql://doadmin:YOUR_PASSWORD@your-db-cluster.db.ondigitalocean.com:25060/cryptoflow?sslmode=require"
  # Connection string to Managed Redis cluster (e.g. DigitalOcean Managed Redis / AWS ElastiCache)
  REDIS_URL: "rediss://default:YOUR_PASSWORD@your-redis-cluster.db.ondigitalocean.com:25061"

  JWT_SECRET: "your-super-secure-jwt-secret-min-32-chars"
  JWT_REFRESH_SECRET: "your-super-secure-jwt-refresh-secret-min-32-chars"
  ENCRYPTION_KEY: "your-32-byte-hex-encryption-key"
  WALLET_ENCRYPTION_KEY: "your-32-byte-hex-wallet-key"

  # External API & Blockchain RPC Keys (Fill in as needed)
  JUPITER_API_KEY: ""
  SOLANA_RPC_URL: "https://api.mainnet-beta.solana.com"
  ONEINCH_API_KEY: ""
  BSC_RPC_URL: "https://bsc-dataseed.binance.org"
