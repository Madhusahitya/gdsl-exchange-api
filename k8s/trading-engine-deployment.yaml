apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdsl-trading-engine
  namespace: gdsl-exchange
  labels:
    app: gdsl-trading-engine
spec:
  # CRITICAL: Must remain 1 replica to prevent duplicate trade executions
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gdsl-trading-engine
  template:
    metadata:
      labels:
        app: gdsl-trading-engine
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: trading-engine
          image: ghcr.io/faiyyajansari1466/gdsl-exchange-api:latest
          imagePullPolicy: Always
          command: ["node", "dist/tradingEngine.js"]
          envFrom:
            - configMapRef:
                name: gdsl-api-config
            - secretRef:
                name: gdsl-api-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1024Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
