apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdsl-worker
  namespace: gdsl-exchange
  labels:
    app: gdsl-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gdsl-worker
  template:
    metadata:
      labels:
        app: gdsl-worker
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: worker
          image: ghcr.io/faiyyajansari1466/gdsl-exchange-api:latest
          imagePullPolicy: Always
          command: ["node", "dist/worker.js"]
          envFrom:
            - configMapRef:
                name: gdsl-api-config
            - secretRef:
                name: gdsl-api-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
